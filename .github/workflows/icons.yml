name: app-icons
on:
  push:
    paths: ['docs/icons/*.svg', '.github/workflows/icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Render PNG icons
        working-directory: docs/icons
        run: |
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          rsvg-convert -w 512 -h 512 maskable.svg -o maskable-512.png
          rsvg-convert -w 180 -h 180 maskable.svg -o apple-touch-icon.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/icons/*.png
          git diff --cached --quiet || (git commit -m "Render app icons" && git push)
