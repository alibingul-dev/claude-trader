<style>
:root{--bg:#0b0e13;--panel:#121722;--panel2:#171d2a;--line:#232b3b;--tx:#e6e9ef;--mut:#8b93a7;--g:#2fd18b;--r:#ff5d6c;--a:#f5b544;--b:#5aa9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:24px 0 18px;border-bottom:1px solid var(--line)}
.left{min-width:0}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.links{display:flex;gap:14px;align-items:center;font-size:13px}.links a{color:var(--mut);text-decoration:none;border-bottom:1px dotted #3a4458}.links a:hover{color:var(--tx)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.lang button{background:transparent;color:var(--mut);border:0;padding:3px 10px;font:500 12px Inter,sans-serif;cursor:pointer}.lang button.on{background:var(--panel2);color:var(--tx)}
h1{margin:0;font-size:20px;font-weight:600}h2{font-size:13px;font-weight:500;color:var(--mut);margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mut);font-size:13px}.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;margin-left:8px}
main{padding:24px 0 48px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1880px;margin:0 auto;padding:0 32px}
aside{position:sticky;top:38px;height:calc(100vh - 38px);padding:16px 0;display:flex;flex-direction:column}
aside .card{flex:1;display:flex;flex-direction:column;overflow:hidden}
.feed{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#000 85%,transparent)}
.feed .inner{will-change:transform}.feed.run .inner{animation:up var(--dur,60s) linear infinite}.feed:hover .inner{animation-play-state:paused}
@keyframes up{to{transform:translateY(-50%)}}
.ticker{position:sticky;top:0;z-index:5;height:38px;overflow:hidden;border-bottom:1px solid var(--line);background:#0e1219;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .track{display:inline-block;padding:9px 0;animation:left var(--tdur,60s) linear infinite}.ticker:hover .track{animation-play-state:paused}
@keyframes left{to{transform:translateX(-50%)}}
.ti{display:inline-block;margin:0 22px;font-size:13px}.ti b{font-weight:600;margin-right:6px}.ti.sep{color:#2a3346}
@media(prefers-reduced-motion:reduce){.ticker .track,.feed .inner{animation:none}}
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.hero4{grid-template-columns:repeat(4,1fr)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.card[data-view]{margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.dec div{white-space:normal}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em}.mid{font-size:22px;font-weight:600}
.lbl{color:var(--mut);font-size:12px;margin-bottom:4px}.u{color:var(--mut);font-size:.55em;font-weight:500;margin-left:4px}
.pos{color:var(--g)}.neg{color:var(--r)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.chart{position:relative;height:280px}.chart.s{height:220px}
details.sp summary{cursor:pointer;list-style:none;display:inline-block;font:600 11.5px Inter,sans-serif;color:var(--g);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}details.sp summary::-webkit-details-marker{display:none}details.sp[open] summary{background:var(--panel2)}details.sp div{margin-top:5px;font-size:12px;line-height:1.5;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #1a2130;white-space:nowrap}tr:hover td{background:#151b27}
.scroll{max-height:420px;overflow:auto;scrollbar-width:thin;scrollbar-color:#2a3346 transparent}
.scroll::-webkit-scrollbar{height:8px;width:8px}.scroll::-webkit-scrollbar-track{background:transparent}.scroll::-webkit-scrollbar-thumb{background:#2a3346;border-radius:4px}.tag{padding:1px 8px;border-radius:6px;font-size:11px;font-weight:500}
.L{background:#12382a;color:var(--g)}.S{background:#3a1820;color:var(--r)}
.dec{padding:12px 0;border-bottom:1px solid #1a2130}.dec .t{color:var(--mut);font-size:12px;margin-bottom:4px}.dec .a{font-size:12px;color:var(--b);margin-top:6px}
.dec .k{display:block;color:var(--mut);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}.dec .k.e{color:var(--a)}
#err{display:none;background:#3a1820;border:1px solid var(--r);color:#ffd0d5;padding:14px 18px;border-radius:12px;margin-bottom:16px}#err.soft{background:#2f2614;border-color:var(--a);color:#ffe3ad}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--g)}
@media(max-width:1100px){.hero,.grid2,.grid3,.wrap{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}aside{position:static;height:600px}}
:root{--rail:236px}
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:#0e1219;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}.brand .name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}.brand .role{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
.nav{padding:10px 0;flex:1}.nav a{display:flex;align-items:center;gap:10px;padding:9px 20px;color:var(--mut);text-decoration:none;font-size:13.5px}.nav a .bar{width:3px;height:16px;border-radius:2px;background:transparent;flex:none}
.nav a:hover{color:var(--tx);background:#141a26}.nav a.on{color:var(--tx)}.nav a.on .bar{background:var(--g)}
.rail-foot{padding:16px 20px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;font-size:12.5px}.rail-foot .links{flex-direction:column;align-items:flex-start;gap:8px}.author{text-align:center}.author .nm{font-weight:700;font-size:14px;color:var(--tx)}.author .row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}.author .ab{color:var(--mut);text-decoration:underline;font-size:12px}.author .ic{color:var(--mut);display:inline-flex}.author a:hover{color:var(--tx)}.rail-foot .lang{align-self:center}
tr.clk{cursor:pointer}tr.clk:hover td{background:#18202f}
.modal{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}.modal[hidden]{display:none}
.modal .card{width:min(1100px,100%);max-height:92vh;overflow:auto}.modal .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}.modal .x{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;cursor:pointer;font:500 13px Inter,sans-serif}
.modal .chart{height:min(420px,55vh)}.modal .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.page{margin-left:var(--rail);min-width:0}
.topbar{display:none}.scrim{position:fixed;inset:0;background:#000a;z-index:45}.scrim[hidden]{display:none}
.burger{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:grid;place-content:center;gap:4px;cursor:pointer;padding:0}.burger span{display:block;width:16px;height:2px;border-radius:1px;background:var(--tx)}
[data-view][hidden]{display:none!important}
#karar .feed{height:min(560px,70vh);overflow-y:auto;-webkit-mask-image:none;scrollbar-width:thin;scrollbar-color:#2a3346 transparent;padding-right:6px}
@media(max-width:900px){
  .rail{width:min(86vw,280px);transform:translateX(-102%);transition:transform .22s ease-out;z-index:50;box-shadow:0 0 40px #000c}.rail.open{transform:none}
  .page{margin-left:0}.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:38px;z-index:4;background:var(--bg)}.topbar strong{font-size:15px}
  .wrap{padding:0 14px}header{flex-direction:column;align-items:flex-start}.hero{grid-template-columns:1fr 1fr}.big{font-size:26px}.mid{font-size:19px}.card{padding:14px}
  .ti{font-size:12px;margin:0 14px}
}
#ct-intro{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#111a2b 0%,#07090d 70%);animation:ctOut .25s ease-in 2.15s forwards}
#ct-intro .ct-chart{width:min(92vw,860px);height:auto;margin-top:-4vh}
#ct-intro .ct-grid line{stroke:#1d2638;stroke-width:1;stroke-dasharray:4 6}
#ct-intro .ct-c{opacity:0;transform:scaleY(.2);transform-box:fill-box;transform-origin:center;animation:ctGrow .22s cubic-bezier(.2,.8,.2,1) forwards}
#ct-intro .ct-eq{fill:none;stroke:url(#ctLine);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1600;stroke-dashoffset:1600;animation:ctDraw .8s cubic-bezier(.65,0,.35,1) .6s forwards}
#ct-intro .ct-dot{fill:#fff;opacity:0;animation:ctFade .15s ease-out 1.35s forwards,ctPulse .9s ease-in-out 1.5s infinite}
#ct-intro .ct-title{display:flex;font-size:clamp(26px,5.6vw,60px);font-weight:700;letter-spacing:.14em;margin-top:2vh}
#ct-intro .ct-title span{display:inline-block;opacity:0;transform:translateY(18px);color:#e6e9ef;animation:ctLetter .18s cubic-bezier(.2,.8,.2,1) forwards}#ct-intro .ct-title .sp{width:.45em}
#ct-intro .ct-sub{margin-top:12px;font-size:clamp(13px,1.6vw,17px);color:#94a3b8;letter-spacing:.06em;opacity:0;animation:ctFade .2s ease-out 1.65s forwards}
#ct-intro .ct-by{margin-top:8px;font-size:clamp(11px,1.2vw,13px);color:#64748b;letter-spacing:.16em;opacity:0;animation:ctFade .2s ease-out 1.75s forwards}
#ct-intro .ct-skip{position:absolute;bottom:22px;right:24px;background:none;border:1px solid #334155;color:#94a3b8;border-radius:8px;padding:6px 12px;font:500 12px Inter,sans-serif;cursor:pointer}
#ct-intro.ct-done{animation:ctOut .12s ease-in forwards}
@keyframes ctGrow{to{opacity:1;transform:none}}@keyframes ctDraw{to{stroke-dashoffset:0}}@keyframes ctFade{to{opacity:1}}@keyframes ctPulse{50%{r:9}}@keyframes ctLetter{to{opacity:1;transform:none}}@keyframes ctOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}
@media(prefers-reduced-motion:reduce){#ct-intro{display:none!important}}
.sbox{display:flex;flex-direction:column;gap:18px;padding-top:6px}.sbox .r{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:6px 12px}.sbox .n{font-size:20px;font-weight:600;text-align:right}.sbox .m{grid-column:2/4;color:var(--mut);font-size:12px}.sbox .tr{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.sbox .tr>i{display:block;height:100%;border-radius:3px}
.gloss{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.6}.gloss b{color:var(--tx);font-weight:500}
.tnav{display:flex;gap:2px}.tnav .nl{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;padding:6px 8px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);text-decoration:none;font:500 12px/1 Inter,sans-serif;cursor:pointer}.tnav .nl:hover{color:var(--tx);border-bottom-color:var(--g)}.tnav .nl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tnav .nl[hidden]{display:none}
@media(max-width:900px){.hdr-r{align-items:flex-start}.tnav .nl{min-width:0;padding:6px;font-size:11px}}
.br{display:block;width:100%;margin-top:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--tx);font:600 14px Inter,sans-serif;text-align:left;cursor:pointer}.br:disabled{opacity:.4;cursor:not-allowed}
.dl{font:600 12.5px Inter,sans-serif;color:#0b0e13;background:var(--g);border:0;border-radius:99px;padding:7px 14px;cursor:pointer}.dl:hover{filter:brightness(1.1)}.dl.off{background:var(--panel2);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}.dl.off:hover{filter:none}.dl[hidden]{display:none}
#pwa-install{position:fixed;right:18px;bottom:18px;z-index:40;display:inline-flex;align-items:center;gap:8px;font:600 13px Inter,sans-serif;color:#0b0e13;background:var(--g);border:0;border-radius:99px;padding:10px 18px;cursor:pointer;box-shadow:0 8px 24px #0009}#pwa-install[hidden]{display:none}
</style>

<body>
